<!doctype html>
<html lang="he" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<title>מיון כדורים</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
  <header>
    <button id="menuBtn" class="icon-btn" aria-label="תפריט">
      <svg viewBox="0 0 24 24"><path d="M4 7h16M4 12h16M4 17h16"/></svg>
    </button>
    <div class="title">
      <div id="levelTitle">שלב 1</div>
      <div id="levelBadge"></div>
    </div>
    <div id="coins" class="coins"><i class="coin"></i><span id="coinVal">0</span></div>
  </header>

  <main id="board"></main>
  <div id="tip"></div>

  <footer>
    <button id="btnRestart" class="tool">
      <svg viewBox="0 0 24 24"><path d="M20 12a8 8 0 1 1-2.34-5.66"/><path d="M20 4v5h-5"/></svg>
      <span class="lbl">מחדש</span>
      <span class="price free">חינם</span>
    </button>
    <button id="btnUndo" class="tool">
      <svg viewBox="0 0 24 24"><path d="M15 14l5-5-5-5"/><path d="M20 9H10a6 6 0 0 0 0 12h3"/></svg>
      <span class="lbl">ביטול</span>
      <span class="price"><i class="coin"></i><b id="pUndo">2</b></span>
    </button>
    <button id="btnHint" class="tool">
      <svg viewBox="0 0 24 24"><path d="M9 18h6M10 21h4"/><path d="M12 3a6 6 0 0 0-4 10.5c.8.8 1 1.5 1 2.5h6c0-1 .2-1.7 1-2.5A6 6 0 0 0 12 3z"/></svg>
      <span class="lbl">רמז</span>
      <span class="price"><i class="coin"></i><b id="pHint">5</b></span>
    </button>
    <button id="btnTube" class="tool">
      <svg viewBox="0 0 24 24"><path d="M7 3v13a3 3 0 0 0 6 0V3"/><path d="M5 3h10"/><path d="M19 13v6M16 16h6"/></svg>
      <span class="lbl">מבחנה</span>
      <span class="price"><i class="coin"></i><b id="pTube">25</b></span>
    </button>
  </footer>

  <div id="toast"></div>
  <div id="modal" hidden><div class="sheet" id="sheet"></div></div>

  <script src="core.js"></script>
  <script src="app.js"></script>
</body>
</html>
