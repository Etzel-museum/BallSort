<!doctype html>
<html lang="he" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<title>מבחנות</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
  <div id="scene"></div>

  <!-- ===== home ===== -->
  <section id="home" class="screen">
    <div class="topbar">
      <button id="hSettings" class="round chunky purple" aria-label="הגדרות">
        <svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="3.2"/><path d="M19.4 15a1.7 1.7 0 0 0 .3 1.8l.1.1a2 2 0 1 1-2.8 2.8l-.1-.1a1.7 1.7 0 0 0-1.8-.3 1.7 1.7 0 0 0-1 1.5V21a2 2 0 1 1-4 0v-.1a1.7 1.7 0 0 0-1.1-1.5 1.7 1.7 0 0 0-1.8.3l-.1.1a2 2 0 1 1-2.8-2.8l.1-.1a1.7 1.7 0 0 0 .3-1.8 1.7 1.7 0 0 0-1.5-1H3a2 2 0 1 1 0-4h.1a1.7 1.7 0 0 0 1.5-1.1 1.7 1.7 0 0 0-.3-1.8l-.1-.1a2 2 0 1 1 2.8-2.8l.1.1a1.7 1.7 0 0 0 1.8.3H9a1.7 1.7 0 0 0 1-1.5V3a2 2 0 1 1 4 0v.1a1.7 1.7 0 0 0 1 1.5 1.7 1.7 0 0 0 1.8-.3l.1-.1a2 2 0 1 1 2.8 2.8l-.1.1a1.7 1.7 0 0 0-.3 1.8V9a1.7 1.7 0 0 0 1.5 1H21a2 2 0 1 1 0 4h-.1a1.7 1.7 0 0 0-1.5 1z"/></svg>
      </button>
      <div class="coins"><i class="coin"></i><span class="coinVal">0</span></div>
    </div>

    <div class="logo">
      <div class="logo-1" data-i18n="logo1">מבחנות</div>
      <div class="logo-2" data-i18n="logo2"></div>
    </div>
    <div id="homeTubes" class="home-tubes"></div>

    <div id="eggCard" class="egg-card"></div>

    <div class="home-actions">
      <button id="playBtn" class="chunky green play">
        <span class="play-label" data-i18n="play">שחק</span>
        <span id="playLevel" class="play-level">שלב 1</span>
      </button>
      <div class="home-row">
        <button id="hCollection" class="chunky purple">
          <svg viewBox="0 0 24 24"><path d="M12 3c-3.6 0-6 5-6 9.5A6 6 0 0 0 12 19a6 6 0 0 0 6-6.5C18 8 15.6 3 12 3z"/><path d="M7 11l2.5 1.5L12 10l2.5 2.5L17 11"/></svg>
          <span data-i18n="collection">אוסף</span>
        </button>
        <button id="hLevels" class="chunky blue">
          <svg viewBox="0 0 24 24"><rect x="4" y="4" width="6" height="6" rx="1.5"/><rect x="14" y="4" width="6" height="6" rx="1.5"/><rect x="4" y="14" width="6" height="6" rx="1.5"/><rect x="14" y="14" width="6" height="6" rx="1.5"/></svg>
          <span data-i18n="levels">שלבים</span>
        </button>
      </div>
    </div>
  </section>

  <!-- ===== game ===== -->
  <section id="game" class="screen" hidden>
    <header>
      <button id="homeBtn" class="round chunky purple" aria-label="מסך הבית">
        <svg viewBox="0 0 24 24"><path d="M4 11l8-7 8 7"/><path d="M6 9.5V20h4.5v-5h3v5H18V9.5"/></svg>
      </button>
      <div class="title">
        <div id="levelTitle" class="gold-text">שלב 1</div>
        <div id="levelBadge"></div>
      </div>
      <div class="coins"><i class="coin"></i><span class="coinVal">0</span></div>
    </header>
    <div id="eggBar" class="eggbar"></div>

    <main id="board"></main>
    <div id="tip"></div>

    <footer>
      <button id="btnRestart" class="tool chunky purple">
        <svg viewBox="0 0 24 24"><path d="M20 12a8 8 0 1 1-2.34-5.66"/><path d="M20 4v5h-5"/></svg>
        <span class="lbl" data-i18n="restart">מחדש</span>
      </button>
      <button id="btnUndo" class="tool chunky purple">
        <svg viewBox="0 0 24 24"><path d="M15 14l5-5-5-5"/><path d="M20 9H10a6 6 0 0 0 0 12h3"/></svg>
        <span class="lbl" data-i18n="undo">ביטול</span>
        <span class="badge"><i class="coin"></i><b id="pUndo">2</b></span>
      </button>
      <button id="btnHint" class="tool chunky purple">
        <svg viewBox="0 0 24 24"><path d="M9 18h6M10 21h4"/><path d="M12 3a6 6 0 0 0-4 10.5c.8.8 1 1.5 1 2.5h6c0-1 .2-1.7 1-2.5A6 6 0 0 0 12 3z"/></svg>
        <span class="lbl" data-i18n="hint">רמז</span>
        <span class="badge"><i class="coin"></i><b id="pHint">5</b></span>
      </button>
      <button id="btnTube" class="tool chunky purple">
        <svg viewBox="0 0 24 24"><path d="M7 3v13a3 3 0 0 0 6 0V3"/><path d="M5 3h10"/><path d="M19 13v6M16 16h6"/></svg>
        <span class="lbl" data-i18n="tube">מבחנה</span>
        <span class="badge"><i class="coin"></i><b id="pTube">25</b></span>
      </button>
    </footer>
  </section>

  <div id="toast"></div>
  <div id="loading" hidden><div class="spinner"></div></div>
  <div id="modal" hidden><div class="panel" id="sheet"></div></div>
  <div id="fx"></div>

  <script src="core.js"></script>
  <script src="gfx.js"></script>
  <script src="catalog.js"></script>
  <script src="i18n.js"></script>
  <script src="app.js"></script>
</body>
</html>
