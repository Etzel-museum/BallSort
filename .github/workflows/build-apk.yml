name: Build APK

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      # ubuntu-latest runners ship with the Android SDK preinstalled
      # (ANDROID_HOME already set, licenses already accepted).

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.7"

      - name: Build debug APK
        run: gradle assembleDebug --no-daemon

      - name: Name the APK
        run: cp app/build/outputs/apk/debug/app-debug.apk BallSort.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: BallSort
          path: BallSort.apk

      - name: Create/refresh "latest" release with the APK
        if: github.ref == 'refs/heads/main'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: latest
          name: מבחנות – גרסה עדכנית
          body: התקנה - הורד/י את BallSort.apk לטלפון ופתח/י אותו כדי להתקין.
          files: BallSort.apk
          make_latest: true
